[project]
name = "movie-picker"
version = "0.1.0"
description = "Pick your streaming services and genres, answer ~10 this-or-that questions, get movie recommendations."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
